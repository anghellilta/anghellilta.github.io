<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website &amp; App — Anghellita</title>
  <meta name="description" content="Website and app design projects by Anghellita. UI/UX case studies featuring web platforms and mobile applications.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Clean Preloader Loading State -->
  <div class="site-loader" id="siteLoader">
    <div class="loader-content">
      <img src="title/logo.png" alt="Anghellita Portfolio" class="loader-logo">
      <div class="loader-bar-bg">
        <div class="loader-bar-fill" id="loaderBarFill"></div>
      </div>
    </div>
  </div>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress-bar" id="scrollProgressBar"></div>

  <!-- Page Transition Overlay -->
  <div class="page-transition active" id="pageTransition"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">
      <img src="title/logo.png" alt="Anghellita Logo">
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="webapps.html">Website &amp; App</a></li>
      <li><a href="digitalart.html">Digital Art</a></li>
      <li><a href="tradart.html">Traditional Art</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- Page Header (Clean Dark Theme, Checkered background removed) -->
  <section class="page-header">
    <div class="container">
      <img src="title/website&app.png" alt="Website &amp; App" class="page-title-img">
      <p class="page-subtitle">UI/UX case studies and full-stack development projects</p>
    </div>
  </section>

  <!-- Gallery (Uniform Portrait Rectangle Cards 3:4) -->
  <section class="gallery-section">
    <div class="container">
      <div class="gallery-grid">
        <div class="gallery-item">
          <img src="website&app/Frame 3.png" alt="Website & App — Project 3" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
        <div class="gallery-item">
          <img src="website&app/Frame 4.png" alt="Website & App — Project 4" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
        <div class="gallery-item">
          <img src="website&app/Frame 5.png" alt="Website & App — Project 5" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
        <div class="gallery-item">
          <img src="website&app/Frame 7.png" alt="Website & App — Project 7" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
        <div class="gallery-item">
          <img src="website&app/Frame 8.png" alt="Website & App — Project 8" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
        <div class="gallery-item">
          <img src="website&app/Frame 9.png" alt="Website & App — Project 9" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
        <div class="gallery-item">
          <img src="website&app/frame 11.png" alt="Website & App — Project 11" loading="lazy">
          <div class="gallery-overlay"><span class="gallery-icon">⊕</span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer with Flippable 3D Contact Card -->
  <footer class="footer" id="contact">
    <div class="footer-image-wrapper">
      <div class="footer-flip-card" id="footerFlipCard" title="Click to flip contact card">
        <div class="footer-flip-card-inner">
          
          <!-- Front Face: asset/8.png -->
          <div class="footer-card-front">
            <img src="asset/8.png" alt="Angel Portfolio Artwork" class="footer-card-img" loading="lazy">
          </div>
          
          <!-- Back Face: asset/contact.png + Download CV Button directly below WORK WITH ME text -->
          <div class="footer-card-back">
            <img src="asset/contact.png" alt="Angel Contact Card — angel.e.factor@gmail.com" class="footer-card-img" loading="lazy">
            
            <!-- Download CV Interactive Button (Right Side, Compact, Text-Only) -->
            <div class="contact-card-overlay">
              <a href="Angel_Factor_CV.pdf" download="Angel_Factor_CV.pdf" class="contact-card-cv-btn" title="Download Angel Factor's CV">
                Download My CV
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="footer-contact">
      <h2 class="footer-contact-title">Let's Connect</h2>
      <a href="mailto:angel.e.factor@gmail.com" class="footer-email-link">angel.e.factor@gmail.com</a>
      <div class="footer-socials">
        <a href="mailto:angel.e.factor@gmail.com" class="footer-social-link" aria-label="Email" title="Email: angel.e.factor@gmail.com">✉</a>
        <a href="https://www.instagram.com/nglfctr/" target="_blank" rel="noopener" class="footer-social-link" aria-label="Instagram" title="Instagram: @nglfctr">📷</a>
        <a href="https://www.linkedin.com/in/angelfactor" target="_blank" rel="noopener" class="footer-social-link" aria-label="LinkedIn" title="LinkedIn: Angel Factor">in</a>
      </div>
      <p class="footer-copyright">&copy; 2026 <a href="index.html">Angel</a>. All rights reserved.</p>
    </div>
  </footer>

  <!-- Lightbox with Interactive Zoom Controls -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-zoom-controls">
      <button class="lightbox-zoom-btn" id="lightboxZoomIn" title="Zoom In">+</button>
      <button class="lightbox-zoom-btn" id="lightboxZoomOut" title="Zoom Out">−</button>
      <button class="lightbox-zoom-btn" id="lightboxZoomReset" title="Reset Zoom">↺</button>
    </div>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous">‹</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next">›</button>
    <div class="lightbox-content" id="lightboxContent">
      <img class="lightbox-img" id="lightboxImg" src="" alt="Full-size image">
    </div>
    <span class="lightbox-counter" id="lightboxCounter"></span>
    <span class="lightbox-scroll-hint" id="lightboxScrollHint" style="display:none;">🔍 Click or Pinch to Zoom</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
